<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juan Personal Finances</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%2375AADB'/%3E%3Ccircle cx='24' cy='24' r='16' fill='%23FFFFFF'/%3E%3Ccircle cx='24' cy='24' r='8' fill='%23F6B40E'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <!-- Shown when signed out -->
  <div id="login-root" class="app-shell" style="display:none;"></div>

  <!-- Shown when signed in -->
  <div id="app-root" style="display:none;">
    <div class="flag-stripe"></div>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" fill="#75AADB" />
            <circle cx="24" cy="24" r="16" fill="#FFFFFF" />
            <g fill="#F6B40E">
              <circle cx="24" cy="24" r="7" />
              <g>
                <rect x="23" y="4" width="2" height="6" rx="1" />
                <rect x="23" y="38" width="2" height="6" rx="1" />
                <rect x="4" y="23" width="6" height="2" rx="1" />
                <rect x="38" y="23" width="6" height="2" rx="1" />
                <rect x="9" y="9" width="2" height="6" rx="1" transform="rotate(-45 10 12)" />
                <rect x="37" y="9" width="2" height="6" rx="1" transform="rotate(45 38 12)" />
                <rect x="9" y="33" width="2" height="6" rx="1" transform="rotate(45 10 36)" />
                <rect x="37" y="33" width="2" height="6" rx="1" transform="rotate(-45 38 36)" />
              </g>
            </g>
            <g fill="#4E7FB0">
              <rect x="17" y="26" width="3" height="6" rx="1" />
              <rect x="22.5" y="22" width="3" height="10" rx="1" />
              <rect x="28" y="18" width="3" height="14" rx="1" />
            </g>
          </svg>
          <div class="brand-text">
            <h1>Juan Personal Finances</h1>
            <p>Tu panel financiero personal</p>
          </div>
        </div>
        <div class="header-right">
          <span class="app-date" id="today-date"></span>
          <button class="text-only" id="sign-out-btn">Sign out</button>
        </div>
      </header>

      <nav class="nav-tabs">
        <button class="nav-tab active" data-page="summary">Summary</button>
        <button class="nav-tab" data-page="expenses">Expenses</button>
        <button class="nav-tab" data-page="income">Income</button>
        <button class="nav-tab" data-page="savings">Savings</button>
        <button class="nav-tab" data-page="investments">Investments</button>
      </nav>

      <div id="alerts-root" class="alert-stack"></div>

      <div class="quick-add-bar">
        <button class="primary" id="add-transaction-btn">Add Transaction</button>
        <div class="dropdown">
          <button id="manage-menu-btn">Manage &#9662;</button>
          <div class="dropdown-menu" id="manage-menu">
            <button id="add-account-btn">Add Account</button>
            <button id="add-goal-menu-btn">Add Goal</button>
            <button id="manage-categories-btn">Categories</button>
            <div class="dropdown-divider"></div>
            <button id="add-recurring-btn">Add Recurring Rule</button>
            <button id="manage-recurring-btn">Manage Recurring Rules</button>
          </div>
        </div>
      </div>

      <main id="page-root">
        <!-- Populated by the router in app.js -->
      </main>

      <footer class="app-footer">
        <span>Your data is saved to your account and available on any device you sign in from.</span>
        <span class="dropdown dropdown-up">
          <button class="text-only" id="export-menu-btn">Export / Backup &#9662;</button>
          <div class="dropdown-menu" id="export-menu">
            <button id="export-backup-btn">Full Backup (JSON)</button>
            <button id="export-csv-btn">Transactions (CSV)</button>
            <div class="dropdown-divider"></div>
            <label style="cursor:pointer; display:block; padding: 8px 12px; font-size:14px;">
              Restore Backup
              <input type="file" id="import-backup-input" accept="application/json" style="display:none" />
            </label>
          </div>
        </span>
      </footer>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
